<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>분류 카드</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,500;9..40,600;9..40,700&amp;display=swap">
<style>
@font-face{font-family:'Pretendard';src:url('fonts/Pretendard.woff2') format('woff2');font-weight:45 920;font-display:swap}
body{margin:0;font-family:'Pretendard',system-ui,sans-serif;color:#111111;-webkit-font-smoothing:antialiased}
a{color:#111111}a:hover{color:#5E5E5E}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFFFF; display: flex; flex-direction: column">
  <header style="padding: 24px 8px 10px; display: flex; align-items: center; justify-content: space-between">
    <a href="Main.dc.html" aria-label="닫기" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #111111">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </a>
    <span style="font-size: 15px; font-weight: 600">새 사진 정리</span>
    <span style="width: 44px; text-align: center; font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 600">{{posLabel}}</span>
  </header>
  <div style="height: 2px; background: #E8E8E8"><div style="height: 2px; background: #111111; width: {{progress}}"></div></div>

  <div style="position: relative; flex-shrink: 0">
    <img src="{{photo.src}}" alt="{{photo.alt}}" style="width: 100%; height: 300px; object-fit: cover; display: block">
    <span style="position: absolute; left: 12px; bottom: 12px; background: #111111; color: #FFFFFF; padding: 6px 10px; font-size: 13px; display: flex; align-items: center; gap: 6px">
      <span style="width: 6px; height: 6px; border-radius: 3px; background: #F2541B"></span>앱 추천 · <strong style="font-weight: 700">{{photo.guess}}</strong> <span style="color: #CFCFCF">{{photo.why}}</span>
    </span>
  </div>
  <div style="padding: 10px 20px; display: flex; justify-content: space-between; font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 500; color: #5E5E5E; border-bottom: 1px solid #E8E8E8">
    <span>{{photo.when}}</span><span>{{photo.where}}</span>
  </div>

  <section style="flex: 1; padding: 16px 20px 28px; display: flex; flex-direction: column; gap: 12px">
    <h2 style="margin: 0; font-size: 24px; font-weight: 600; letter-spacing: -0.6px">이 사진은?</h2>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px">
      <sc-for list="{{cats}}" as="c" hint-placeholder-count="4">
        <button onClick="{{c.pick}}" aria-pressed="{{c.sel}}" style="min-height: 52px; border-radius: 4px; border: 1.5px solid {{c.border}}; background: {{c.bg}}; color: {{c.fg}}; font-family: inherit; font-size: 16px; font-weight: 600">{{c.label}}</button>
      </sc-for>
    </div>

    <sc-if value="{{isMine}}" hint-placeholder-val="{{ false }}">
      <div style="display: flex; flex-wrap: wrap; gap: 5px">
        <sc-for list="{{kinds}}" as="k" hint-placeholder-count="6">
          <button onClick="{{k.pick}}" aria-pressed="{{k.sel}}" style="min-height: 38px; padding: 0 12px; border-radius: 4px; border: 1px solid {{k.border}}; background: {{k.bg}}; color: {{k.fg}}; font-family: inherit; font-size: 14px; font-weight: 500">{{k.label}}</button>
        </sc-for>
      </div>
    </sc-if>

    <div style="margin-top: auto; display: flex; flex-direction: column; gap: 4px">
      <sc-if value="{{goNext}}" hint-placeholder-val="{{ true }}">
        <button onClick="{{next}}" style="width: 100%; min-height: 54px; border-radius: 4px; border: 0; background: #111111; color: #FFFFFF; font-family: inherit; font-size: 16px; font-weight: 600">{{cta}}</button>
      </sc-if>
      <sc-if value="{{isOther}}" hint-placeholder-val="{{ false }}">
        <a href="ModelInput.dc.html" style="min-height: 54px; border-radius: 4px; background: #111111; color: #FFFFFF; font-size: 16px; font-weight: 600; text-decoration: none; display: flex; align-items: center; justify-content: center">모델명 입력하고 저장</a>
      </sc-if>
      <sc-if value="{{isCatch}}" hint-placeholder-val="{{ false }}">
        <a href="Catch.dc.html" style="min-height: 54px; border-radius: 4px; background: #111111; color: #FFFFFF; font-size: 16px; font-weight: 600; text-decoration: none; display: flex; align-items: center; justify-content: center">어종 입력하고 조과로 저장</a>
      </sc-if>
      <button onClick="{{next}}" style="min-height: 40px; border: 0; background: none; font-family: inherit; font-size: 14px; color: #5E5E5E; text-decoration: underline">다음 사진 (건너뛰기)</button>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { i: 0, pick: null, kind: '외관' };
  }
  renderVals() {
    const photos = [
      { src: 'img/fish.jpg', alt: '낚싯줄에 걸린 물고기', guess: '조과', why: '물고기가 보여요', when: 'OCT 26 · 15:40', where: '3번 어초 · 출항 중' },
      { src: 'img/marina.jpg', alt: '마리나에 정박한 보트들', guess: '다른 배', why: '배가 보여요', when: 'OCT 26 · 15:12', where: '전곡항' },
      { src: 'img/myboat.jpg', alt: '흰색 보트 정면', guess: '내 배', why: '바다향과 닮았어요', when: 'OCT 25 · 09:03', where: '전곡항 계류장' },
      { src: 'img/beach.jpg', alt: '해변의 작은 배', guess: '다른 배', why: '배가 보여요', when: 'OCT 24 · 17:20', where: '해변' }
    ];
    const s = this.state;
    const photo = photos[s.i];
    const cur = s.pick || photo.guess;
    const labels = ['내 배', '다른 배', '조과', '해당 없음'];
    return {
      photo,
      posLabel: (s.i + 1) + '/12',
      progress: Math.round(((s.i + 1) / 12) * 100) + '%',
      cats: labels.map((label) => {
        const on = label === cur;
        return {
          label,
          sel: on ? 'true' : 'false',
          bg: on ? '#111111' : '#FFFFFF',
          fg: on ? '#FFFFFF' : '#111111',
          border: on ? '#111111' : '#CFCFCF',
          pick: () => this.setState({ pick: label })
        };
      }),
      isMine: cur === '내 배',
      isOther: cur === '다른 배',
      isCatch: cur === '조과',
      goNext: cur === '내 배' || cur === '해당 없음',
      cta: cur === '내 배' ? '바다향 · ' + s.kind + '(으)로 저장' : '사진 숨기기',
      next: () => this.setState({ i: (s.i + 1) % photos.length, pick: null, kind: '외관' }),
      kinds: ['외관', '엔진', '정비', '고장·파손', '출항', '기타'].map((label) => {
        const on = label === s.kind;
        return {
          label,
          sel: on ? 'true' : 'false',
          bg: on ? '#111111' : '#FFFFFF',
          fg: on ? '#FFFFFF' : '#111111',
          border: on ? '#111111' : '#CFCFCF',
          pick: () => this.setState({ kind: label })
        };
      })
    };
  }
}
</script>
</body>
</html>
