<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>이번 달 어종</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,500;9..40,600;9..40,700&amp;display=swap">
<style>
@font-face{font-family:'Pretendard';src:url('fonts/Pretendard.woff2') format('woff2');font-weight:45 920;font-display:swap}
body{margin:0;font-family:'Pretendard',system-ui,sans-serif;color:#111111;-webkit-font-smoothing:antialiased}
a{color:#111111}a:hover{color:#5E5E5E}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFFFF; display: flex; flex-direction: column; overflow: hidden">
  <header style="padding: 24px 20px 0; display: flex; justify-content: space-between; align-items: center">
    <button style="min-height: 44px; border: 0; background: none; padding: 0; display: flex; align-items: center; gap: 6px; font-family: inherit; font-size: 24px; font-weight: 600; letter-spacing: -0.6px; color: #111111">서해 중부
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
    </button>
    <span style="font-family: 'DM Sans', sans-serif; font-size: 12px; font-weight: 600; letter-spacing: 1px; color: #5E5E5E">OCTOBER</span>
  </header>
  <div role="tablist" aria-label="바다 정보" style="display: flex; gap: 18px; padding: 0 20px; border-bottom: 1px solid #E8E8E8">
    <a role="tab" aria-selected="false" href="Tide.dc.html" style="min-height: 42px; display: flex; align-items: center; text-decoration: none; color: #5E5E5E; font-size: 15px">물때·날씨</a>
    <a role="tab" aria-selected="false" href="FishMap.dc.html" style="min-height: 42px; display: flex; align-items: center; text-decoration: none; color: #5E5E5E; font-size: 15px">낚시 지도</a>
    <a role="tab" aria-selected="true" href="SeasonCal.dc.html" style="min-height: 42px; display: flex; align-items: center; border-bottom: 2px solid #111111; margin-bottom: -1px; text-decoration: none; color: #111111; font-size: 15px; font-weight: 600">이번 달 어종</a>
  </div>

  <main style="flex: 1; overflow: hidden; padding: 12px 20px 0; display: flex; flex-direction: column">
    <div style="display: flex; justify-content: space-between; align-items: baseline">
      <h1 style="margin: 0; font-size: 20px; font-weight: 600; letter-spacing: -0.5px">10월, 지금 시즌</h1>
      <span style="font-size: 11px; color: #5E5E5E">예시 데이터 · 공공 자료 연동 예정</span>
    </div>
    <div style="display: grid; grid-template-columns: 92px repeat(12, minmax(0, 1fr)); gap: 2px; margin-top: 8px; font-family: 'DM Sans', sans-serif; font-size: 10.5px; color: #5E5E5E; text-align: center">
      <span></span><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span><span>6</span><span>7</span><span>8</span><span>9</span><span style="color: #111111; font-weight: 700">10</span><span>11</span><span>12</span>
    </div>
    <div style="border-top: 1px solid #111111; margin-top: 4px">
      <sc-for list="{{fish}}" as="f" hint-placeholder-count="5">
        <div style="display: grid; grid-template-columns: 92px repeat(12, minmax(0, 1fr)); gap: 2px; align-items: center; min-height: 44px; border-bottom: 1px solid #E8E8E8">
          <span style="display: flex; flex-direction: column; gap: 1px"><span style="font-size: 15px; font-weight: 600">{{f.name}}</span><span style="font-size: 11px; color: {{f.tagColor}}; font-weight: 600">{{f.tag}}</span></span>
          <sc-for list="{{f.months}}" as="m" hint-placeholder-count="12">
            <span style="height: 12px; background: {{m.c}}; outline: {{m.o}}"></span>
          </sc-for>
        </div>
      </sc-for>
    </div>
    <div style="display: flex; gap: 12px; margin-top: 6px; font-size: 11px; color: #5E5E5E">
      <span style="display: flex; align-items: center; gap: 4px"><span style="width: 10px; height: 10px; background: #111111"></span>제철</span>
      <span style="display: flex; align-items: center; gap: 4px"><span style="width: 10px; height: 10px; background: #CFCFCF"></span>잡히는 시기</span>
      <span style="display: flex; align-items: center; gap: 4px"><span style="width: 10px; height: 10px; background: #FBE3DA; border: 1px solid #C23B0E; box-sizing: border-box"></span>금어기</span>
    </div>

    <h2 style="margin: 18px 0 6px; font-size: 17px; font-weight: 600; letter-spacing: -0.3px">금어기 · 금지체장 알림</h2>
    <div style="border-top: 1px solid #111111">
      <sc-for list="{{bans}}" as="b" hint-placeholder-count="3">
        <div style="display: flex; align-items: center; gap: 10px; min-height: 52px; border-bottom: 1px solid #E8E8E8">
          <div style="flex: 1; display: flex; flex-direction: column; gap: 1px">
            <span style="font-size: 15px; font-weight: 600">{{b.name}} <span style="font-family: 'DM Sans', sans-serif; font-size: 12px; font-weight: 700; color: {{b.ddColor}}">{{b.dd}}</span></span>
            <span style="font-size: 12px; color: #5E5E5E">{{b.rule}}</span>
          </div>
          <button onClick="{{b.toggle}}" role="switch" aria-checked="{{b.on}}" aria-label="{{b.name}} 금어기 알림" style="width: 52px; height: 44px; border: 0; background: none; padding: 0; display: flex; align-items: center; justify-content: center">
            <span style="width: 44px; height: 26px; border-radius: 13px; background: {{b.track}}; position: relative; display: block"><span style="position: absolute; top: 3px; left: {{b.knob}}; width: 20px; height: 20px; border-radius: 10px; background: #FFFFFF"></span></span>
          </button>
        </div>
      </sc-for>
    </div>
    <p style="margin: 8px 0 0; font-size: 11px; line-height: 1.5; color: #5E5E5E">기간과 체장은 해양수산부 고시 기준으로 연동해요. 지역별 예외가 있을 수 있으니 출조 전 확인하세요.</p>
  </main>

  <nav aria-label="하단 메뉴" style="display: flex; border-top: 1px solid #E8E8E8; background: #FFFFFF; padding: 0 8px 18px">
    <a href="Main.dc.html" style="flex: 1; min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #5E5E5E; font-size: 14px; font-weight: 500"><span style="width: 4px; height: 4px"></span>홈</a>
    <a href="Tide.dc.html" style="flex: 1; min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #111111; font-size: 14px; font-weight: 700"><span style="width: 4px; height: 4px; border-radius: 2px; background: #F2541B"></span>바다</a>
    <a href="MyBoat.dc.html" style="flex: 1; min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #5E5E5E; font-size: 14px; font-weight: 500"><span style="width: 4px; height: 4px"></span>내 배</a>
    <a href="Collection.dc.html" style="flex: 1; min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #5E5E5E; font-size: 14px; font-weight: 500"><span style="width: 4px; height: 4px"></span>컬렉션</a>
    <a href="CatchInsights.dc.html" style="flex: 1; min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #5E5E5E; font-size: 14px; font-weight: 500"><span style="width: 4px; height: 4px"></span>조과</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { alerts: { '주꾸미': true, '[어종 B]': true, '[어종 C]': false } };
  }
  renderVals() {
    const cur = 9;
    const rows = [
      { name: '주꾸미', tag: '한창', peak: [8, 9, 10], open: [2, 3, 11], ban: [4, 5, 6, 7] },
      { name: '갑오징어', tag: '한창', peak: [8, 9, 10], open: [3, 4, 5, 7, 11], ban: [] },
      { name: '우럭', tag: '한창', peak: [9, 10, 11], open: [0, 1, 2, 3, 4, 5, 6, 7, 8], ban: [] },
      { name: '광어', tag: '막바지', peak: [4, 5, 8, 9], open: [3, 6, 7, 10], ban: [] },
      { name: '삼치', tag: '시작', peak: [10, 11], open: [8, 9], ban: [] }
    ];
    const tagColor = { '한창': '#C23B0E', '막바지': '#5E5E5E', '시작': '#111111' };
    const alerts = this.state.alerts;
    const bans = [
      { name: '주꾸미', dd: '', rule: '금어기 [고시 기간] · 내년 시작 7일 전 알림' },
      { name: '[어종 B]', dd: 'D-12', rule: '금어기 [고시 기간] 시작 · 금지체장 [cm] 미만 방생' },
      { name: '[어종 C]', dd: '', rule: '금지체장 [cm] 미만 방생 · 연중 적용' }
    ];
    return {
      fish: rows.map((r) => ({
        name: r.name,
        tag: r.tag,
        tagColor: tagColor[r.tag],
        months: Array.from({ length: 12 }, (_, m) => ({
          c: r.ban.includes(m) ? '#FBE3DA' : (r.peak.includes(m) ? '#111111' : (r.open.includes(m) ? '#CFCFCF' : '#F2F2F2')),
          o: m === cur ? '2px solid #F2541B' : 'none'
        }))
      })),
      bans: bans.map((b) => {
        const on = !!alerts[b.name];
        return {
          name: b.name,
          dd: b.dd,
          ddColor: '#C23B0E',
          rule: b.rule,
          on: on ? 'true' : 'false',
          track: on ? '#111111' : '#CFCFCF',
          knob: on ? '21px' : '3px',
          toggle: () => this.setState({ alerts: Object.assign({}, alerts, { [b.name]: !on }) })
        };
      })
    };
  }
}
</script>
</body>
</html>
