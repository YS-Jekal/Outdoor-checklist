<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>경로 그리기</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,500;9..40,600;9..40,700&amp;display=swap">
<style>
@font-face{font-family:'Pretendard';src:url('fonts/Pretendard.woff2') format('woff2');font-weight:45 920;font-display:swap}
body{margin:0;font-family:'Pretendard',system-ui,sans-serif;color:#111111;-webkit-font-smoothing:antialiased}
a{color:#111111}a:hover{color:#5E5E5E}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFFFF; display: flex; flex-direction: column; overflow: hidden">
  <header style="padding: 24px 8px 8px; display: flex; align-items: center; gap: 4px; border-bottom: 1px solid #E8E8E8">
    <a href="TripPlan.dc.html" aria-label="뒤로" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #111111">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </a>
    <div style="display: flex; flex-direction: column">
      <span style="font-family: 'DM Sans', sans-serif; font-size: 11px; font-weight: 600; letter-spacing: 1.2px; color: #5E5E5E">ROUTE</span>
      <span style="font-size: 17px; font-weight: 600">제부도 → 덕적도</span>
    </div>
    <button onClick="{{toggleFarms}}" aria-pressed="{{farmsOn}}" style="margin-left: auto; margin-right: 8px; min-height: 36px; padding: 0 12px; border-radius: 18px; border: 1px solid {{farmBorder}}; background: {{farmBg}}; color: {{farmFg}}; font-family: inherit; font-size: 13px; font-weight: 500">양식장 표시</button>
  </header>

  <div style="position: relative; height: 470px; flex-shrink: 0; background: #E4EBEE">
    <svg width="390" height="470" viewBox="0 0 390 470" role="img" aria-label="제부도에서 덕적도까지 섬과 양식장을 피해 그린 경로" style="display: block">
      <defs>
        <pattern id="farm-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
          <rect width="6" height="6" fill="#FBE3DA"/>
          <line x1="0" y1="0" x2="0" y2="6" stroke="#C2531F" stroke-width="1.5"/>
        </pattern>
      </defs>
      <path d="M362 0 H390 V470 H350 C 356 420, 344 380, 352 340 C 360 300, 372 260, 366 210 C 360 160, 372 80, 362 0 Z" fill="#F5F5F2" stroke="#CDD3D1"/>
      <path d="M312 300 C 326 290, 344 298, 342 316 C 340 334, 318 340, 308 328 C 300 318, 302 306, 312 300 Z" fill="#F5F5F2" stroke="#CDD3D1"/>
      <path d="M36 140 C 52 118, 92 120, 100 146 C 108 172, 84 196, 58 192 C 34 188, 24 162, 36 140 Z" fill="#F5F5F2" stroke="#CDD3D1"/>
      <path d="M176 226 C 196 210, 232 218, 236 246 C 240 274, 212 290, 190 282 C 170 274, 162 240, 176 226 Z" fill="#F5F5F2" stroke="#CDD3D1"/>
      <path d="M122 318 C 136 306, 162 312, 162 332 C 162 352, 140 358, 126 350 C 114 342, 112 328, 122 318 Z" fill="#F5F5F2" stroke="#CDD3D1"/>
      <path d="M246 168 C 256 160, 272 164, 272 176 C 272 188, 258 192, 250 186 C 242 180, 240 174, 246 168 Z" fill="#F5F5F2" stroke="#CDD3D1"/>
      <g opacity="{{farmOpacity}}">
        <rect x="246" y="286" width="54" height="40" fill="url(#farm-hatch)" stroke="#C2531F" stroke-width="1"/>
        <rect x="222" y="338" width="62" height="30" fill="url(#farm-hatch)" stroke="#C2531F" stroke-width="1"/>
        <rect x="140" y="192" width="44" height="26" fill="url(#farm-hatch)" stroke="#C2531F" stroke-width="1"/>
      </g>
      <line x1="320" y1="318" x2="80" y2="166" stroke="#8A9497" stroke-width="1.5" stroke-dasharray="5 5"/>
      <polyline points="{{pts}}" fill="none" stroke="#111111" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="288" cy="400" r="9" fill="#FFFFFF" stroke="#111111" stroke-width="2" opacity="{{w1}}"/>
      <text x="288" y="404" text-anchor="middle" font-family="DM Sans, sans-serif" font-size="11" font-weight="700" fill="#111111" opacity="{{w1}}">1</text>
      <circle cx="176" cy="404" r="9" fill="#FFFFFF" stroke="#111111" stroke-width="2" opacity="{{w2}}"/>
      <text x="176" y="408" text-anchor="middle" font-family="DM Sans, sans-serif" font-size="11" font-weight="700" fill="#111111" opacity="{{w2}}">2</text>
      <circle cx="96" cy="262" r="9" fill="#FFFFFF" stroke="#111111" stroke-width="2" opacity="{{w3}}"/>
      <text x="96" y="266" text-anchor="middle" font-family="DM Sans, sans-serif" font-size="11" font-weight="700" fill="#111111" opacity="{{w3}}">3</text>
      <rect x="313" y="311" width="14" height="14" fill="#111111"/>
      <circle cx="80" cy="166" r="8" fill="#F2541B" stroke="#FFFFFF" stroke-width="2.5"/>
      <text x="304" y="296" text-anchor="end" font-size="13" font-weight="700" fill="#111111">제부도</text>
      <text x="64" y="112" font-size="13" font-weight="700" fill="#111111">덕적도</text>
    </svg>
    <button onClick="{{add}}" aria-label="지도를 눌러 경유지 추가" style="position: absolute; inset: 0; border: 0; background: transparent; cursor: crosshair"></button>
    <sc-for list="{{legs}}" as="l" hint-placeholder-count="4">
      <span style="position: absolute; left: {{l.x}}; top: {{l.y}}; transform: translate(-50%, -50%); background: #FFFFFF; padding: 2px 6px; font-family: 'DM Sans', sans-serif; font-size: 11px; font-weight: 700; pointer-events: none">{{l.km}} km</span>
    </sc-for>
    <span style="position: absolute; left: 12px; top: 12px; background: #111111; color: #FFFFFF; padding: 6px 10px; font-size: 12px; font-weight: 500; pointer-events: none">{{hint}}</span>
    <span style="position: absolute; right: 12px; bottom: 12px; background: #FFFFFF; padding: 4px 8px; font-size: 11px; color: #5E5E5E; pointer-events: none">점선 = 직선 44 km</span>
  </div>

  <section style="flex: 1; padding: 14px 20px 0; display: flex; flex-direction: column; gap: 6px">
    <div style="display: flex; justify-content: space-between; align-items: baseline">
      <span style="font-family: 'DM Sans', sans-serif; font-size: 30px; font-weight: 600; letter-spacing: -1px">{{total}}<span style="font-size: 14px; color: #5E5E5E"> km · {{nm}} NM</span></span>
      <span style="font-size: 13px; font-weight: 600; color: {{diffColor}}">{{diff}}</span>
    </div>
    <span style="font-size: 13px; color: #5E5E5E">편도 · 경유지 {{n}}곳 · 저장하면 다음에 다시 쓸 수 있어요</span>
    <div style="display: flex; gap: 6px; margin-top: 4px">
      <button onClick="{{undo}}" style="min-height: 40px; padding: 0 14px; border-radius: 4px; border: 1px solid #CFCFCF; background: #FFFFFF; font-family: inherit; font-size: 14px; color: #111111">되돌리기</button>
      <button onClick="{{reset}}" style="min-height: 40px; padding: 0 14px; border-radius: 4px; border: 1px solid #CFCFCF; background: #FFFFFF; font-family: inherit; font-size: 14px; color: #111111">처음부터</button>
      <button style="min-height: 40px; padding: 0 14px; border-radius: 4px; border: 1px solid #CFCFCF; background: #FFFFFF; font-family: inherit; font-size: 14px; color: #111111">GPX 불러오기</button>
    </div>
    <p style="margin: 4px 0 0; font-size: 11px; line-height: 1.5; color: #5E5E5E">거리 계산용 경로예요. 항해 안내가 아니니 실제 항해는 해도와 현장 상황을 꼭 확인하세요.</p>
  </section>

  <footer style="padding: 8px 20px 28px">
    <a href="TripPlan.dc.html" style="min-height: 54px; border-radius: 4px; background: #111111; color: #FFFFFF; font-size: 16px; font-weight: 600; text-decoration: none; display: flex; align-items: center; justify-content: center">이 경로로 연료 계산</a>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { n: 3, farms: true };
  }
  renderVals() {
    const start = [320, 318];
    const dest = [80, 166];
    const wps = [[288, 400], [176, 404], [96, 262]];
    const legKm = [10, 16, 18];
    const toDest = [44, 42, 28, 14];
    const n = this.state.n;
    const pts = [start].concat(wps.slice(0, n)).concat([dest]);
    const kms = legKm.slice(0, n).concat([toDest[n]]);
    const total = kms.reduce((a, b) => a + b, 0);
    const legs = kms.map((km, i) => ({
      km,
      x: Math.round((pts[i][0] + pts[i + 1][0]) / 2) + 'px',
      y: Math.round((pts[i][1] + pts[i + 1][1]) / 2) + 'px'
    }));
    const farms = this.state.farms;
    const diff = total - 44;
    return {
      pts: pts.map((p) => p.join(',')).join(' '),
      w1: n >= 1 ? 1 : 0,
      w2: n >= 2 ? 1 : 0,
      w3: n >= 3 ? 1 : 0,
      legs,
      n,
      total,
      nm: (total / 1.852).toFixed(1),
      diff: diff > 0 ? '직선보다 +' + diff + ' km' : '직선 경로',
      diffColor: diff > 0 ? '#111111' : '#C23B0E',
      hint: n < 3 ? '지도를 눌러 경유지를 추가하세요' : '점을 끌어 옮길 수 있어요',
      add: () => this.setState({ n: Math.min(n + 1, 3) }),
      undo: () => this.setState({ n: Math.max(n - 1, 0) }),
      reset: () => this.setState({ n: 0 }),
      farmOpacity: farms ? 1 : 0,
      farmsOn: farms ? 'true' : 'false',
      farmBg: farms ? '#111111' : '#FFFFFF',
      farmFg: farms ? '#FFFFFF' : '#111111',
      farmBorder: farms ? '#111111' : '#CFCFCF',
      toggleFarms: () => this.setState({ farms: !farms })
    };
  }
}
</script>
</body>
</html>
