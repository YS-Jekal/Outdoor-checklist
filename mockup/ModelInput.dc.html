<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>모델명 입력</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,500;9..40,600;9..40,700&amp;display=swap">
<style>
@font-face{font-family:'Pretendard';src:url('fonts/Pretendard.woff2') format('woff2');font-weight:45 920;font-display:swap}
body{margin:0;font-family:'Pretendard',system-ui,sans-serif;color:#111111;-webkit-font-smoothing:antialiased}
a{color:#111111}a:hover{color:#5E5E5E}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFFFF; display: flex; flex-direction: column">
  <div style="position: relative; flex-shrink: 0">
    <img src="img/marina.jpg" alt="분류 중인 사진" style="width: 100%; height: 190px; object-fit: cover; display: block">
    <a href="Inbox.dc.html" aria-label="뒤로" style="position: absolute; left: 8px; top: 24px; width: 44px; height: 44px; border-radius: 22px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; color: #111111">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </a>
  </div>

  <main style="flex: 1; padding: 22px 20px 0; display: flex; flex-direction: column; overflow: hidden">
    <span style="font-family: 'DM Sans', sans-serif; font-size: 12px; font-weight: 600; letter-spacing: 1.4px; color: #5E5E5E">SPOTTED · OCT 26 · 전곡항</span>
    <h1 style="margin: 10px 0 18px; font-size: 26px; font-weight: 600; letter-spacing: -0.7px">어떤 모델인가요?</h1>

    <label for="model-q" style="font-size: 13px; color: #5E5E5E">제조사 → 모델</label>
    <div style="display: flex; align-items: center; gap: 8px; min-height: 52px; border-bottom: 2px solid #111111">
      <input id="model-q" value="[제조사 A] " style="flex: 1; border: 0; outline: none; font-family: inherit; font-size: 20px; font-weight: 500; color: #111111; background: transparent; padding: 0">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5E5E5E" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4-4"/></svg>
    </div>
    <div>
      <sc-for list="{{suggest}}" as="m" hint-placeholder-count="3">
        <button style="width: 100%; min-height: 54px; padding: 0; border: 0; border-bottom: 1px solid #E8E8E8; background: none; display: flex; justify-content: space-between; align-items: center; font-family: inherit; font-size: 16px; color: #111111; text-align: left">
          <span>[제조사 A] <strong style="font-weight: 600">{{m.name}}</strong></span>
          <span style="font-family: 'DM Sans', sans-serif; font-size: 12px; font-weight: 500; color: #5E5E5E">{{m.meta}}</span>
        </button>
      </sc-for>
      <button style="width: 100%; min-height: 54px; padding: 0; border: 0; border-bottom: 1px solid #E8E8E8; background: none; display: flex; align-items: center; font-family: inherit; font-size: 15px; color: #111111; text-decoration: underline">목록에 없어요 · 직접 입력</button>
    </div>

    <span style="margin-top: 20px; font-size: 13px; color: #5E5E5E">최근 입력</span>
    <div style="display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px">
      <button style="min-height: 40px; padding: 0 14px; border-radius: 4px; border: 1px solid #CFCFCF; background: #FFFFFF; font-family: inherit; font-size: 14px; color: #111111">[제조사 A] [모델 1]</button>
      <button style="min-height: 40px; padding: 0 14px; border-radius: 4px; border: 1px solid #CFCFCF; background: #FFFFFF; font-family: inherit; font-size: 14px; color: #111111">[제조사 B] [모델 2]</button>
    </div>
  </main>

  <footer style="padding: 12px 20px 30px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
    <a href="Inbox.dc.html" style="min-height: 54px; border-radius: 4px; border: 1.5px solid #111111; color: #111111; font-size: 16px; font-weight: 600; text-decoration: none; display: flex; align-items: center; justify-content: center">모르겠어요</a>
    <a href="Inbox.dc.html" style="min-height: 54px; border-radius: 4px; background: #111111; color: #FFFFFF; font-size: 16px; font-weight: 600; text-decoration: none; display: flex; align-items: center; justify-content: center">컬렉션에 저장</a>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      suggest: [
        { name: '[모델 1]', meta: '214 TAGS' },
        { name: '[모델 3]', meta: '87 TAGS' },
        { name: '[모델 4]', meta: '12 TAGS' }
      ]
    };
  }
}
</script>
</body>
</html>
