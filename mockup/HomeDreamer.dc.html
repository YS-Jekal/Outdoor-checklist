<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>드림 보트 홈</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,500;9..40,600;9..40,700&amp;display=swap">
<style>
@font-face{font-family:'Pretendard';src:url('fonts/Pretendard.woff2') format('woff2');font-weight:45 920;font-display:swap}
body{margin:0;font-family:'Pretendard',system-ui,sans-serif;color:#111111;-webkit-font-smoothing:antialiased}
a{color:#111111}a:hover{color:#5E5E5E}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFFFF; display: flex; flex-direction: column; overflow: hidden">
  <header style="padding: 26px 20px 12px; display: flex; justify-content: space-between; align-items: baseline">
    <span style="font-size: 20px; font-weight: 700; letter-spacing: -0.5px">나만의바다</span>
    <span style="font-family: 'DM Sans', sans-serif; font-size: 12px; font-weight: 600; letter-spacing: 1.2px; color: #5E5E5E">OCT 28 · 조금</span>
  </header>

  <main style="flex: 1; overflow: hidden; display: flex; flex-direction: column">
    <a href="DreamSurvey.dc.html" style="text-decoration: none; color: #111111; display: flex; flex-direction: column">
      <img src="img/dream.jpg" alt="FRP 하우스 보트 예시" style="width: 100%; height: 190px; object-fit: cover; display: block">
      <div style="padding: 14px 20px 14px; display: flex; flex-direction: column; gap: 4px; border-bottom: 1px solid #E8E8E8">
        <div style="display: flex; justify-content: space-between; align-items: center">
          <span style="font-family: 'DM Sans', sans-serif; font-size: 12px; font-weight: 600; letter-spacing: 1.4px; color: #5E5E5E">MY DREAM BOAT</span>
          <span style="font-size: 13px; color: #5E5E5E; text-decoration: underline">수정</span>
        </div>
        <span style="font-size: 24px; line-height: 1.3; font-weight: 600; letter-spacing: -0.6px">FRP 하우스</span>
        <span style="font-size: 14px; color: #5E5E5E">바다낚시 · 가족 나들이</span>
        <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); margin-top: 8px; border-top: 1px solid #111111">
          <div style="padding: 8px 0 2px; display: flex; flex-direction: column; gap: 1px; border-right: 1px solid #E8E8E8"><span style="font-size: 12px; color: #5E5E5E">크기</span><span style="font-family: 'DM Sans', sans-serif; font-size: 18px; font-weight: 600">20–24<span style="font-size: 12px; color: #5E5E5E"> ft</span></span></div>
          <div style="padding: 8px 10px 2px; display: flex; flex-direction: column; gap: 1px; border-right: 1px solid #E8E8E8"><span style="font-size: 12px; color: #5E5E5E">엔진</span><span style="font-family: 'DM Sans', sans-serif; font-size: 18px; font-weight: 600">50–150<span style="font-size: 12px; color: #5E5E5E"> 마력</span></span></div>
          <div style="padding: 8px 10px 2px; display: flex; flex-direction: column; gap: 1px"><span style="font-size: 12px; color: #5E5E5E">보관</span><span style="font-size: 16px; font-weight: 600">계류장</span></div>
        </div>
        <span style="font-size: 13px; color: #5E5E5E; margin-top: 6px">3천만~1억 원 · 1~3년 안에 · 면허 준비 중</span>
      </div>
    </a>

    <section style="padding: 18px 20px 4px">
      <div style="display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px">
        <span style="font-size: 17px; font-weight: 600; letter-spacing: -0.3px">드림 보트까지</span>
        <span style="font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 600; color: #5E5E5E">1 / 4</span>
      </div>
      <sc-for list="{{steps}}" as="s" hint-placeholder-count="4">
        <div style="display: flex; align-items: center; gap: 14px; min-height: 48px; border-bottom: 1px solid #F0F0F0">
          <span style="font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 600; width: 22px; color: {{s.numColor}}">{{s.no}}</span>
          <span style="flex: 1; font-size: 15px; color: {{s.fg}}; text-decoration: {{s.strike}}">{{s.title}}</span>
          <span style="font-size: 13px; color: #5E5E5E">{{s.sub}}</span>
        </div>
      </sc-for>
    </section>

    <a href="Inbox.dc.html" style="margin: 14px 20px 0; min-height: 52px; padding: 0 16px; background: #111111; color: #FFFFFF; border-radius: 4px; text-decoration: none; display: flex; align-items: center; justify-content: space-between; font-size: 15px; font-weight: 600">
      <span>사진첩에서 배 사진 찾기</span>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </a>
  </main>

  <nav aria-label="하단 메뉴" style="display: flex; border-top: 1px solid #E8E8E8; background: #FFFFFF; padding: 0 8px 18px">
    <a href="HomeDreamer.dc.html" style="flex: 1; min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #111111; font-size: 14px; font-weight: 700"><span style="width: 4px; height: 4px; border-radius: 2px; background: #F2541B"></span>홈</a>
    <a href="Tide.dc.html" style="flex: 1; min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #5E5E5E; font-size: 14px; font-weight: 500"><span style="width: 4px; height: 4px"></span>바다</a>
    <a href="Collection.dc.html" style="flex: 1; min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #5E5E5E; font-size: 14px; font-weight: 500"><span style="width: 4px; height: 4px"></span>드림 보트</a>
    <a href="CatchInsights.dc.html" style="flex: 1; min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #5E5E5E; font-size: 14px; font-weight: 500"><span style="width: 4px; height: 4px"></span>조과</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const steps = [
      { title: '드림 보트 정하기', sub: '완료', done: true },
      { title: '조종면허 따기', sub: '가이드 →', done: false },
      { title: '배 먼저 타 보기', sub: '선상·렌탈 →', done: false },
      { title: '정박지·유지비 알아보기', sub: '예상 비용 →', done: false }
    ];
    return {
      steps: steps.map((s, i) => ({
        no: '0' + (i + 1),
        title: s.title,
        sub: s.sub,
        numColor: s.done ? '#F2541B' : '#5E5E5E',
        fg: s.done ? '#5E5E5E' : '#111111',
        strike: s.done ? 'line-through' : 'none'
      }))
    };
  }
}
</script>
</body>
</html>
