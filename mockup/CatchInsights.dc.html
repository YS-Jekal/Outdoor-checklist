<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>나만의 조과 패턴</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,500;9..40,600;9..40,700&amp;display=swap">
<style>
@font-face{font-family:'Pretendard';src:url('fonts/Pretendard.woff2') format('woff2');font-weight:45 920;font-display:swap}
body{margin:0;font-family:'Pretendard',system-ui,sans-serif;color:#111111;-webkit-font-smoothing:antialiased}
a{color:#111111}a:hover{color:#5E5E5E}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFFFF; display: flex; flex-direction: column; overflow: hidden">
  <header style="padding: 26px 20px 0; display: flex; justify-content: space-between; align-items: center">
    <div style="display: flex; flex-direction: column; gap: 2px">
      <span style="font-family: 'DM Sans', sans-serif; font-size: 12px; font-weight: 600; letter-spacing: 1.4px; color: #5E5E5E">MY CATCH PATTERN · 2026</span>
      <h1 style="margin: 0; font-size: 28px; font-weight: 600; letter-spacing: -0.8px">조과</h1>
    </div>
    <div style="display: flex; gap: 6px">
      <a href="PointCatch.dc.html" style="min-height: 40px; padding: 0 12px; border-radius: 20px; background: #F2541B; color: #111111; font-size: 14px; font-weight: 700; text-decoration: none; display: flex; align-items: center; gap: 5px">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="2.5" fill="currentColor"/></svg>캐치
      </a>
      <a href="Catch.dc.html" style="min-height: 40px; padding: 0 12px; border-radius: 20px; background: #111111; color: #FFFFFF; font-size: 14px; font-weight: 600; text-decoration: none; display: flex; align-items: center">+ 조과</a>
    </div>
  </header>

  <main style="flex: 1; overflow: hidden; padding: 12px 20px 0; display: flex; flex-direction: column">
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-top: 1px solid #111111; border-bottom: 1px solid #E8E8E8">
      <div style="padding: 8px 0; display: flex; flex-direction: column; gap: 1px; border-right: 1px solid #E8E8E8"><span style="font-size: 12px; color: #5E5E5E">출조</span><span style="font-family: 'DM Sans', sans-serif; font-size: 20px; font-weight: 600">31<span style="font-size: 12px; color: #5E5E5E"> 회</span></span></div>
      <div style="padding: 8px 10px; display: flex; flex-direction: column; gap: 1px; border-right: 1px solid #E8E8E8"><span style="font-size: 12px; color: #5E5E5E">조과</span><span style="font-family: 'DM Sans', sans-serif; font-size: 20px; font-weight: 600">142<span style="font-size: 12px; color: #5E5E5E"> 마리</span></span></div>
      <div style="padding: 8px 10px; display: flex; flex-direction: column; gap: 1px"><span style="font-size: 12px; color: #5E5E5E">최대어</span><span style="font-family: 'DM Sans', sans-serif; font-size: 20px; font-weight: 600">62<span style="font-size: 12px; color: #5E5E5E"> cm 광어</span></span></div>
    </div>

    <div style="display: flex; gap: 18px; border-bottom: 1px solid #E8E8E8; margin-top: 4px">
      <sc-for list="{{species}}" as="s" hint-placeholder-count="3">
        <button onClick="{{s.pick}}" aria-pressed="{{s.sel}}" style="min-height: 44px; padding: 0; border: 0; border-bottom: 2px solid {{s.line}}; margin-bottom: -1px; background: none; font-family: inherit; font-size: 15px; font-weight: {{s.weight}}; color: {{s.fg}}">{{s.label}} <span style="font-family: 'DM Sans', sans-serif; font-size: 12px; color: #5E5E5E">{{s.n}}</span></button>
      </sc-for>
    </div>

    <h2 style="margin: 14px 0 4px; font-size: 20px; line-height: 1.35; font-weight: 600; letter-spacing: -0.5px">{{p.headline}}</h2>
    <span style="font-size: 12px; color: #5E5E5E">내 기록 {{p.trips}}회 기준 · 기록이 쌓일수록 정확해져요</span>

    <div style="margin-top: 12px; display: flex; flex-direction: column; gap: 6px">
      <span style="font-size: 13px; font-weight: 600">물때별 조과</span>
      <div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; align-items: end; height: 84px; border-bottom: 1px solid #111111">
        <sc-for list="{{p.bars}}" as="b" hint-placeholder-count="6">
          <div style="display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 3px; height: 100%">
            <span style="font-family: 'DM Sans', sans-serif; font-size: 11px; font-weight: 600; color: {{b.labelColor}}">{{b.n}}</span>
            <span style="width: 100%; height: {{b.h}}; background: {{b.color}}"></span>
          </div>
        </sc-for>
      </div>
      <div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; text-align: center; font-size: 11px; color: #5E5E5E">
        <span>초들물</span><span>중들물</span><span>끝들물</span><span>초날물</span><span>중날물</span><span>끝날물</span>
      </div>
    </div>

    <div style="margin-top: 10px; border-top: 1px solid #E8E8E8">
      <sc-for list="{{p.rows}}" as="r" hint-placeholder-count="3">
        <div style="display: flex; justify-content: space-between; align-items: baseline; min-height: 38px; padding: 8px 0; box-sizing: border-box; border-bottom: 1px solid #E8E8E8; font-size: 14px">
          <span style="color: #5E5E5E">{{r.k}}</span><span style="font-weight: 600">{{r.v}}</span>
        </div>
      </sc-for>
    </div>

    <a href="Tide.dc.html" style="margin-top: 12px; padding: 12px 14px; background: #111111; color: #FFFFFF; text-decoration: none; display: flex; flex-direction: column; gap: 3px">
      <span style="font-family: 'DM Sans', sans-serif; font-size: 11px; font-weight: 600; letter-spacing: 1.2px; color: #F2541B">TODAY VS MY PATTERN</span>
      <span style="font-size: 15px; font-weight: 600">{{p.today}}</span>
      <span style="font-size: 12px; color: #CFCFCF">내 과거 기록과 비교한 것이에요. 예측이 아니에요.</span>
    </a>
  </main>

  <nav aria-label="하단 메뉴" style="display: flex; border-top: 1px solid #E8E8E8; background: #FFFFFF; padding: 0 8px 18px">
    <a href="Main.dc.html" style="flex: 1; min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #5E5E5E; font-size: 14px; font-weight: 500"><span style="width: 4px; height: 4px"></span>홈</a>
    <a href="Tide.dc.html" style="flex: 1; min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #5E5E5E; font-size: 14px; font-weight: 500"><span style="width: 4px; height: 4px"></span>바다</a>
    <a href="MyBoat.dc.html" style="flex: 1; min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #5E5E5E; font-size: 14px; font-weight: 500"><span style="width: 4px; height: 4px"></span>내 배</a>
    <a href="Collection.dc.html" style="flex: 1; min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #5E5E5E; font-size: 14px; font-weight: 500"><span style="width: 4px; height: 4px"></span>컬렉션</a>
    <a href="CatchInsights.dc.html" style="flex: 1; min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #111111; font-size: 14px; font-weight: 700"><span style="width: 4px; height: 4px; border-radius: 2px; background: #F2541B"></span>조과</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { sp: '광어' };
  }
  renderVals() {
    const data = {
      '광어': {
        n: 38, trips: 14, counts: [4, 15, 9, 3, 5, 2],
        headline: '광어는 중들물, 수온 17~19°C에 가장 많이 잡았어요',
        rows: [['잘 된 수온', '17–19°C · 24마리 (63%)'], ['잘 된 시간', '새벽 5–8시'], ['잘 된 포인트', '3번 어초 · 18마리']],
        today: '오늘 중들물 14:20–15:40 · 수온 17.8°C — 내 패턴과 비슷해요'
      },
      '우럭': {
        n: 57, trips: 19, counts: [6, 9, 14, 11, 10, 7],
        headline: '우럭은 물때보다 포인트가 중요했어요. 끝들물에 조금 더 많았어요',
        rows: [['잘 된 수온', '15–18°C'], ['잘 된 시간', '오후 2–5시'], ['잘 된 포인트', '침선 A · 21마리']],
        today: '오늘 끝들물 15:40–17:00 · 침선 A까지 9 km'
      },
      '쭈꾸미': {
        n: 47, trips: 8, counts: [3, 5, 6, 12, 14, 7],
        headline: '쭈꾸미는 날물 초중반, 물 흐름 약한 날에 많았어요',
        rows: [['잘 된 물때', '조금 전후 3일'], ['잘 된 시간', '오전 9–12시'], ['잘 된 포인트', '서쪽 모래밭 · 26마리']],
        today: '오늘 조금 · 물 흐름 약함 — 내 쭈꾸미 패턴과 비슷해요'
      }
    };
    const sp = this.state.sp;
    const d = data[sp];
    const max = Math.max.apply(null, d.counts);
    return {
      species: Object.keys(data).map((label) => {
        const on = label === sp;
        return {
          label,
          n: data[label].n,
          sel: on ? 'true' : 'false',
          line: on ? '#111111' : 'transparent',
          weight: on ? 600 : 400,
          fg: on ? '#111111' : '#5E5E5E',
          pick: () => this.setState({ sp: label })
        };
      }),
      p: {
        headline: d.headline,
        trips: d.trips,
        today: d.today,
        rows: d.rows.map(([k, v]) => ({ k, v })),
        bars: d.counts.map((n) => ({
          n,
          h: Math.round((n / max) * 64) + 'px',
          color: n === max ? '#F2541B' : '#111111',
          labelColor: n === max ? '#C23B0E' : '#5E5E5E'
        }))
      }
    };
  }
}
</script>
</body>
</html>
