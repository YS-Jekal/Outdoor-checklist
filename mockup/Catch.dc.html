<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>조과 기록</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,500;9..40,600;9..40,700&amp;display=swap">
<style>
@font-face{font-family:'Pretendard';src:url('fonts/Pretendard.woff2') format('woff2');font-weight:45 920;font-display:swap}
body{margin:0;font-family:'Pretendard',system-ui,sans-serif;color:#111111;-webkit-font-smoothing:antialiased}
a{color:#111111}a:hover{color:#5E5E5E}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFFFF; display: flex; flex-direction: column; overflow: hidden">
  <div style="position: relative; flex-shrink: 0">
    <img src="img/fish.jpg" alt="방금 낚은 물고기" style="width: 100%; height: 230px; object-fit: cover; display: block">
    <a href="CatchInsights.dc.html" aria-label="닫기" style="position: absolute; left: 8px; top: 24px; width: 44px; height: 44px; border-radius: 22px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; color: #111111">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </a>
    <button aria-label="사진 추가" style="position: absolute; right: 12px; bottom: 12px; min-height: 36px; padding: 0 12px; border: 0; border-radius: 4px; background: #FFFFFF; font-family: inherit; font-size: 13px; font-weight: 600; color: #111111">+ 사진 1/5</button>
  </div>

  <main style="flex: 1; overflow: hidden; padding: 16px 20px 0; display: flex; flex-direction: column">
    <span style="font-family: 'DM Sans', sans-serif; font-size: 12px; font-weight: 600; letter-spacing: 1.4px; color: #5E5E5E">CATCH LOG · OCT 26 · 15:40</span>

    <div style="display: flex; gap: 18px; margin-top: 10px; border-bottom: 1px solid #E8E8E8; overflow: hidden">
      <sc-for list="{{fish}}" as="f" hint-placeholder-count="5">
        <button onClick="{{f.pick}}" aria-pressed="{{f.sel}}" style="min-height: 44px; padding: 0; border: 0; border-bottom: 2px solid {{f.line}}; margin-bottom: -1px; background: none; color: {{f.fg}}; font-family: inherit; font-size: 17px; font-weight: {{f.weight}}; white-space: nowrap">{{f.label}}</button>
      </sc-for>
    </div>
    <p style="margin: 8px 0 0; font-size: 13px; color: #C23B0E">{{rule}}</p>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; margin-top: 14px">
      <label style="display: flex; flex-direction: column; gap: 2px; font-size: 13px; color: #5E5E5E">크기
        <span style="display: flex; align-items: baseline; gap: 4px; border-bottom: 2px solid #111111"><input value="42" inputmode="decimal" style="width: 100%; min-height: 48px; border: 0; outline: none; padding: 0; font-family: 'DM Sans', sans-serif; font-size: 30px; font-weight: 600; color: #111111; background: transparent"><span style="font-family: 'DM Sans', sans-serif; font-size: 14px">cm</span></span>
      </label>
      <label style="display: flex; flex-direction: column; gap: 2px; font-size: 13px; color: #5E5E5E">마리 수
        <span style="display: flex; align-items: baseline; gap: 4px; border-bottom: 2px solid #111111"><input value="3" inputmode="numeric" style="width: 100%; min-height: 48px; border: 0; outline: none; padding: 0; font-family: 'DM Sans', sans-serif; font-size: 30px; font-weight: 600; color: #111111; background: transparent"><span style="font-size: 14px">마리</span></span>
      </label>
    </div>

    <div style="margin-top: 16px; border-top: 1px solid #111111">
      <div style="display: flex; justify-content: space-between; align-items: center; min-height: 50px; border-bottom: 1px solid #E8E8E8">
        <span style="font-size: 13px; color: #5E5E5E; width: 64px">포인트</span>
        <span style="flex: 1; font-size: 15px; font-weight: 600">내 포인트 · 3번 어초</span>
        <span style="font-size: 13px; text-decoration: underline">변경</span>
      </div>
      <div style="display: flex; align-items: center; min-height: 50px; border-bottom: 1px solid #E8E8E8">
        <span style="font-size: 13px; color: #5E5E5E; width: 64px">조건</span>
        <span style="flex: 1; font-size: 14px">조금 · 들물 · <span style="font-family: 'DM Sans', sans-serif">NW 4.0 m/s · 17.8°C</span></span>
        <span style="font-family: 'DM Sans', sans-serif; font-size: 11px; font-weight: 600; letter-spacing: 1px; color: #5E5E5E">AUTO</span>
      </div>
      <label style="display: flex; align-items: center; min-height: 50px; border-bottom: 1px solid #E8E8E8">
        <span style="font-size: 13px; color: #5E5E5E; width: 64px">배</span>
        <span style="flex: 1; font-size: 15px; font-weight: 600">바다향으로 출항</span>
        <input type="checkbox" checked style="width: 22px; height: 22px; accent-color: #111111">
      </label>
    </div>
  </main>

  <footer style="padding: 12px 20px 30px">
    <a href="CatchInsights.dc.html" style="min-height: 54px; border-radius: 4px; background: #111111; color: #FFFFFF; font-size: 16px; font-weight: 600; text-decoration: none; display: flex; align-items: center; justify-content: center">조과 저장</a>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { fish: '광어' };
  }
  renderVals() {
    const sel = this.state.fish;
    return {
      rule: sel + ' 포획금지체장·금어기 [공식 기준 연동] 확인 후 방생 여부를 판단하세요',
      fish: ['광어', '우럭', '쭈꾸미', '갑오징어', '참돔'].map((label) => {
        const on = label === sel;
        return {
          label,
          sel: on ? 'true' : 'false',
          line: on ? '#111111' : 'transparent',
          fg: on ? '#111111' : '#5E5E5E',
          weight: on ? 600 : 400,
          pick: () => this.setState({ fish: label })
        };
      })
    };
  }
}
</script>
</body>
</html>
