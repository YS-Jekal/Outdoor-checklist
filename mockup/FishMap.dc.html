<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>낚시 지도</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,500;9..40,600;9..40,700&amp;display=swap">
<style>
@font-face{font-family:'Pretendard';src:url('fonts/Pretendard.woff2') format('woff2');font-weight:45 920;font-display:swap}
body{margin:0;font-family:'Pretendard',system-ui,sans-serif;color:#111111;-webkit-font-smoothing:antialiased}
a{color:#111111}a:hover{color:#5E5E5E}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFFFF; display: flex; flex-direction: column; overflow: hidden">
  <header style="padding: 24px 20px 0; display: flex; justify-content: space-between; align-items: center">
    <button style="min-height: 44px; border: 0; background: none; padding: 0; display: flex; align-items: center; gap: 6px; font-family: inherit; font-size: 24px; font-weight: 600; letter-spacing: -0.6px; color: #111111">전곡항 주변
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
    </button>
    <button aria-label="포인트 검색" style="width: 44px; height: 44px; border: 0; background: none; display: flex; align-items: center; justify-content: center; color: #111111">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4-4"/></svg>
    </button>
  </header>
  <div role="tablist" aria-label="바다 정보" style="display: flex; gap: 18px; padding: 0 20px; border-bottom: 1px solid #E8E8E8">
    <a role="tab" aria-selected="false" href="Tide.dc.html" style="min-height: 42px; display: flex; align-items: center; text-decoration: none; color: #5E5E5E; font-size: 15px">물때·날씨</a>
    <a role="tab" aria-selected="true" href="FishMap.dc.html" style="min-height: 42px; display: flex; align-items: center; border-bottom: 2px solid #111111; margin-bottom: -1px; text-decoration: none; color: #111111; font-size: 15px; font-weight: 600">낚시 지도</a>
    <a role="tab" aria-selected="false" href="SeasonCal.dc.html" style="min-height: 42px; display: flex; align-items: center; text-decoration: none; color: #5E5E5E; font-size: 15px">이번 달 어종</a>
  </div>

  <div style="display: flex; gap: 5px; padding: 8px 20px; overflow-x: auto">
    <sc-for list="{{layers}}" as="l" hint-placeholder-count="5">
      <button onClick="{{l.pick}}" aria-pressed="{{l.sel}}" style="min-height: 36px; padding: 0 10px; border-radius: 18px; border: 1px solid {{l.border}}; background: {{l.bg}}; color: {{l.fg}}; font-family: inherit; font-size: 13px; font-weight: 500; white-space: nowrap">{{l.label}}</button>
    </sc-for>
  </div>

  <div style="position: relative; flex: 1; background: #E4EBEE; overflow: hidden">
    <svg width="390" height="400" viewBox="0 0 390 400" role="img" aria-label="전곡항 주변 낚시 지도: 내 포인트, 인공어초, 침선, 암초, 낚시 금지구역" style="display: block">
      <defs>
        <pattern id="ban-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
          <rect width="6" height="6" fill="#FBE3DA"/>
          <line x1="0" y1="0" x2="0" y2="6" stroke="#C23B0E" stroke-width="1.5"/>
        </pattern>
      </defs>
      <path d="M300 0 H390 V400 H330 C 340 340, 320 300, 334 250 C 348 200, 352 150, 330 100 C 314 64, 312 30, 300 0 Z" fill="#F5F5F2" stroke="#CDD3D1"/>
      <path d="M140 120 C 156 106, 186 112, 188 134 C 190 156, 164 166, 148 158 C 132 150, 128 132, 140 120 Z" fill="#F5F5F2" stroke="#CDD3D1"/>
      <path d="M60 280 C 74 270, 96 276, 96 292 C 96 308, 76 314, 64 306 C 52 298, 50 288, 60 280 Z" fill="#F5F5F2" stroke="#CDD3D1"/>
      <text x="306" y="214" font-size="12" font-weight="700" fill="#111111">전곡항</text>
      <rect x="292" y="220" width="10" height="10" fill="#111111"/>
      <g opacity="{{op.ban}}">
        <path d="M250 40 L300 30 L310 90 L262 98 Z" fill="url(#ban-hatch)" stroke="#C23B0E"/>
        <text x="256" y="70" font-size="11" font-weight="700" fill="#8A2A0A">금지구역</text>
      </g>
      <g opacity="{{op.reef}}" fill="none" stroke="#111111" stroke-width="1.5">
        <rect x="200" y="250" width="12" height="12"/><rect x="104" y="196" width="12" height="12"/><rect x="232" y="150" width="12" height="12"/>
      </g>
      <g opacity="{{op.wreck}}">
        <path d="M150 334 h22 l-4 7 h-14 z" fill="#111111"/><line x1="161" y1="334" x2="161" y2="324" stroke="#111111" stroke-width="1.5"/>
        <text x="178" y="340" font-size="11" font-weight="600" fill="#111111">침선 A</text>
      </g>
      <g opacity="{{op.rock}}" stroke="#111111" stroke-width="2" stroke-linecap="round">
        <path d="M260 312 l8 8 M268 312 l-8 8"/><path d="M120 250 l8 8 M128 250 l-8 8"/>
      </g>
      <g opacity="{{op.caught}}" fill="#F2541B" stroke="#FFFFFF" stroke-width="2">
        <path d="M118 172 l9 11 l-9 11 l-9 -11 z"/><path d="M236 214 l9 11 l-9 11 l-9 -11 z"/><path d="M48 236 l9 11 l-9 11 l-9 -11 z"/>
      </g>
      <g opacity="{{op.mine}}">
        <circle cx="206" cy="256" r="18" fill="#F2541B" fill-opacity="0.18"/>
        <path d="M206 236 c-8 0 -13 6 -13 13 c0 9 13 20 13 20 s13 -11 13 -20 c0 -7 -5 -13 -13 -13 z" fill="#F2541B" stroke="#FFFFFF" stroke-width="2"/>
        <text x="206" y="253" text-anchor="middle" font-family="DM Sans, sans-serif" font-size="10" font-weight="700" fill="#111111">27</text>
        <path d="M161 300 c-6 0 -10 5 -10 10 c0 7 10 15 10 15 s10 -8 10 -15 c0 -5 -4 -10 -10 -10 z" fill="#111111" stroke="#FFFFFF" stroke-width="2"/>
        <path d="M86 214 c-6 0 -10 5 -10 10 c0 7 10 15 10 15 s10 -8 10 -15 c0 -5 -4 -10 -10 -10 z" fill="#111111" stroke="#FFFFFF" stroke-width="2"/>
      </g>
    </svg>
    <span style="position: absolute; right: 10px; top: 10px; background: #FFFFFF; padding: 4px 8px; font-size: 11px; color: #5E5E5E">공공 해도 데이터 · 참고용</span>
    <a href="PointCatch.dc.html" style="position: absolute; right: 14px; bottom: 14px; min-height: 56px; padding: 0 20px; border-radius: 28px; background: #F2541B; color: #111111; font-size: 16px; font-weight: 700; text-decoration: none; display: flex; align-items: center; gap: 8px; box-shadow: 0 4px 12px rgba(17,17,17,0.25)">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="2.5" fill="currentColor"/><path d="M12 1v3M12 20v3M1 12h3M20 12h3"/></svg>포인트 캐치
    </a>
  </div>

  <section style="padding: 12px 20px 10px; border-top: 1px solid #111111; display: flex; flex-direction: column; gap: 6px">
    <div style="display: flex; justify-content: space-between; align-items: baseline">
      <span style="font-size: 18px; font-weight: 600; letter-spacing: -0.4px">3번 어초 <span style="font-size: 13px; font-weight: 400; color: #5E5E5E">· 내 포인트 · 인공어초</span></span>
      <span style="font-family: 'DM Sans', sans-serif; font-size: 13px; color: #5E5E5E">9 km</span>
    </div>
    <span style="font-size: 13px; color: #5E5E5E">수심 18 m · 사각형 어초 · 설치 [연도]</span>
    <span style="font-size: 14px">내 조과 <strong style="font-weight: 600">광어 18 · 우럭 9</strong> · 잘 된 물때 중들물 · 최근 10.26</span>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; margin-top: 2px">
      <a href="RoutePlot.dc.html" style="min-height: 44px; border-radius: 4px; background: #111111; color: #FFFFFF; font-size: 14px; font-weight: 600; text-decoration: none; display: flex; align-items: center; justify-content: center">여기로 경로 그리기</a>
      <a href="CatchInsights.dc.html" style="min-height: 44px; border-radius: 4px; border: 1px solid #111111; color: #111111; font-size: 14px; font-weight: 600; text-decoration: none; display: flex; align-items: center; justify-content: center">이 포인트 조과 보기</a>
    </div>
  </section>

  <nav aria-label="하단 메뉴" style="display: flex; border-top: 1px solid #E8E8E8; background: #FFFFFF; padding: 0 8px 18px">
    <a href="Main.dc.html" style="flex: 1; min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #5E5E5E; font-size: 14px; font-weight: 500"><span style="width: 4px; height: 4px"></span>홈</a>
    <a href="Tide.dc.html" style="flex: 1; min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #111111; font-size: 14px; font-weight: 700"><span style="width: 4px; height: 4px; border-radius: 2px; background: #F2541B"></span>바다</a>
    <a href="MyBoat.dc.html" style="flex: 1; min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #5E5E5E; font-size: 14px; font-weight: 500"><span style="width: 4px; height: 4px"></span>내 배</a>
    <a href="Collection.dc.html" style="flex: 1; min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #5E5E5E; font-size: 14px; font-weight: 500"><span style="width: 4px; height: 4px"></span>컬렉션</a>
    <a href="CatchInsights.dc.html" style="flex: 1; min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #5E5E5E; font-size: 14px; font-weight: 500"><span style="width: 4px; height: 4px"></span>조과</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { mine: true, caught: true, reef: true, wreck: true, rock: true, ban: true };
  }
  renderVals() {
    const defs = [['mine', '내 포인트'], ['caught', '캐치한 곳 3'], ['reef', '어초'], ['wreck', '침선'], ['rock', '암초'], ['ban', '금지구역']];
    const op = {};
    defs.forEach(([k]) => { op[k] = this.state[k] ? 1 : 0; });
    return {
      op,
      layers: defs.map(([k, label]) => {
        const on = this.state[k];
        return {
          label,
          sel: on ? 'true' : 'false',
          bg: on ? '#111111' : '#FFFFFF',
          fg: on ? '#FFFFFF' : '#111111',
          border: on ? '#111111' : '#CFCFCF',
          pick: () => this.setState({ [k]: !on })
        };
      })
    };
  }
}
</script>
</body>
</html>
