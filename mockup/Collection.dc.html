<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>컬렉션</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,500;9..40,600;9..40,700&amp;display=swap">
<style>
@font-face{font-family:'Pretendard';src:url('fonts/Pretendard.woff2') format('woff2');font-weight:45 920;font-display:swap}
body{margin:0;font-family:'Pretendard',system-ui,sans-serif;color:#111111;-webkit-font-smoothing:antialiased}
a{color:#111111}a:hover{color:#5E5E5E}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFFFF; display: flex; flex-direction: column; overflow: hidden">
  <header style="padding: 26px 20px 0; display: flex; flex-direction: column; gap: 6px">
    <h1 style="margin: 0; font-size: 28px; font-weight: 600; letter-spacing: -0.8px">컬렉션</h1>
    <span style="font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 500; color: #5E5E5E">48 BOATS · 19 MODELS · ♥ 3</span>
    <div role="tablist" aria-label="보기 방식" style="display: flex; gap: 20px; border-bottom: 1px solid #E8E8E8; margin-top: 8px">
      <sc-for list="{{views}}" as="v" hint-placeholder-count="3">
        <button role="tab" aria-selected="{{v.sel}}" onClick="{{v.pick}}" style="min-height: 44px; padding: 0; border: 0; border-bottom: 2px solid {{v.line}}; margin-bottom: -1px; background: none; color: {{v.fg}}; font-family: inherit; font-size: 15px; font-weight: {{v.weight}}">{{v.label}}</button>
      </sc-for>
    </div>
  </header>

  <main style="flex: 1; overflow: hidden; display: flex; flex-direction: column">
    <a href="Inbox.dc.html" style="text-decoration: none; color: #111111; padding: 0 20px; min-height: 48px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid #E8E8E8; font-size: 14px">
      <span style="width: 6px; height: 6px; border-radius: 3px; background: #F2541B"></span>
      <span style="flex: 1">모델 모름 7장 · 지금 태그 달기</span>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </a>

    <div style="position: relative">
      <img src="img/yacht.jpg" alt="[제조사 B] [모델 2]" style="width: 100%; height: 210px; object-fit: cover; display: block">
      <button aria-label="원하는 배에서 빼기" style="position: absolute; right: 8px; top: 8px; width: 44px; height: 44px; border: 0; border-radius: 22px; background: #FFFFFF; display: flex; align-items: center; justify-content: center">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="#F2541B" stroke="#111111" stroke-width="1.4" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7-4.5-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.5-7 10-7 10z"/></svg>
      </button>
    </div>
    <div style="padding: 10px 20px 14px; display: flex; justify-content: space-between; align-items: baseline">
      <span style="font-size: 17px; font-weight: 600; letter-spacing: -0.3px">[제조사 B] [모델 2]</span>
      <span style="font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 500; color: #5E5E5E">6 PHOTOS · 수영만</span>
    </div>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 3px; padding: 0 0">
      <sc-for list="{{models}}" as="m" hint-placeholder-count="4">
        <div style="display: flex; flex-direction: column; gap: 6px">
          <img src="{{m.src}}" alt="{{m.name}}" style="width: 100%; height: 118px; object-fit: cover; display: block">
          <div style="padding: 0 12px; display: flex; flex-direction: column; gap: 1px">
            <span style="font-size: 14px; font-weight: 600">{{m.name}}</span>
            <span style="font-family: 'DM Sans', sans-serif; font-size: 12px; font-weight: 500; color: #5E5E5E">{{m.meta}}</span>
          </div>
        </div>
      </sc-for>
    </div>
  </main>

  <nav aria-label="하단 메뉴" style="display: flex; border-top: 1px solid #E8E8E8; background: #FFFFFF; padding: 0 8px 18px">
    <a href="Main.dc.html" style="flex: 1; min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #5E5E5E; font-size: 14px; font-weight: 500"><span style="width: 4px; height: 4px"></span>홈</a>
    <a href="Tide.dc.html" style="flex: 1; min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #5E5E5E; font-size: 14px; font-weight: 500"><span style="width: 4px; height: 4px"></span>바다</a>
    <a href="MyBoat.dc.html" style="flex: 1; min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #5E5E5E; font-size: 14px; font-weight: 500"><span style="width: 4px; height: 4px"></span>내 배</a>
    <a href="Collection.dc.html" style="flex: 1; min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #111111; font-size: 14px; font-weight: 700"><span style="width: 4px; height: 4px; border-radius: 2px; background: #F2541B"></span>컬렉션</a>
    <a href="CatchInsights.dc.html" style="flex: 1; min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #5E5E5E; font-size: 14px; font-weight: 500"><span style="width: 4px; height: 4px"></span>조과</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { view: '모델별' };
  }
  renderVals() {
    return {
      views: ['모델별', '지도', '날짜'].map((label) => {
        const on = label === this.state.view;
        return {
          label,
          sel: on ? 'true' : 'false',
          line: on ? '#111111' : 'transparent',
          fg: on ? '#111111' : '#5E5E5E',
          weight: on ? 600 : 400,
          pick: () => this.setState({ view: label })
        };
      }),
      models: [
        { name: '[제조사 A] [모델 1]', meta: '4 PHOTOS · 전곡항', src: 'img/sport.jpg' },
        { name: '[제조사 A] [모델 3]', meta: '3 PHOTOS · 보관소', src: 'img/dream.jpg' },
        { name: '모델 모름', meta: '2 PHOTOS · 해변', src: 'img/beach.jpg' },
        { name: '[제조사 C] [모델 5]', meta: '1 PHOTO · 바다 위', src: 'img/fishing.jpg' }
      ]
    };
  }
}
</script>
</body>
</html>
