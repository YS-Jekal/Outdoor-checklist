<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>드림 보트 설문</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,500;9..40,600;9..40,700&amp;display=swap">
<style>
@font-face{font-family:'Pretendard';src:url('fonts/Pretendard.woff2') format('woff2');font-weight:45 920;font-display:swap}
body{margin:0;font-family:'Pretendard',system-ui,sans-serif;color:#111111;-webkit-font-smoothing:antialiased}
a{color:#111111}a:hover{color:#5E5E5E}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFFFF; display: flex; flex-direction: column">
  <header style="padding: 24px 8px 0 8px; display: flex; align-items: center; justify-content: space-between">
    <button onClick="{{back}}" aria-label="이전 질문" style="width: 44px; height: 44px; border: 0; background: none; display: flex; align-items: center; justify-content: center; color: #111111">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
    </button>
    <a href="HomeDreamer.dc.html" style="min-height: 44px; padding: 0 12px; display: flex; align-items: center; font-size: 14px; color: #5E5E5E; text-decoration: none">건너뛰기</a>
  </header>
  <div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 4px; padding: 4px 20px 0">
    <sc-for list="{{bars}}" as="b" hint-placeholder-count="6">
      <span style="height: 2px; background: {{b.color}}"></span>
    </sc-for>
  </div>

  <main style="flex: 1; padding: 28px 20px 0; display: flex; flex-direction: column; overflow: hidden">
    <span style="font-family: 'DM Sans', sans-serif; font-size: 12px; font-weight: 600; letter-spacing: 1.4px; color: #5E5E5E">DREAM BOAT — 0{{num}} / 06</span>
    <h1 style="margin: 12px 0 6px; font-size: 28px; line-height: 1.3; font-weight: 600; letter-spacing: -0.8px">{{question}}</h1>
    <span style="font-size: 15px; color: #5E5E5E; margin-bottom: 20px">{{hint}}</span>

    <sc-if value="{{isList}}" hint-placeholder-val="{{ true }}">
      <div style="border-top: 1px solid #111111">
        <sc-for list="{{options}}" as="o" hint-placeholder-count="5">
          <button onClick="{{o.pick}}" aria-pressed="{{o.sel}}" style="width: 100%; min-height: 54px; padding: 0; border: 0; border-bottom: 1px solid #E8E8E8; background: none; color: #111111; font-family: inherit; font-size: 17px; font-weight: {{o.weight}}; display: flex; align-items: center; justify-content: space-between; text-align: left">
            <span>{{o.label}}</span>
            <span style="width: 22px; height: 22px; border: 1.5px solid #111111; background: {{o.box}}; display: flex; align-items: center; justify-content: center; box-sizing: border-box">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg>
            </span>
          </button>
        </sc-for>
      </div>
    </sc-if>

    <sc-if value="{{isGroups}}" hint-placeholder-val="{{ false }}">
      <div style="display: flex; flex-direction: column; gap: 18px">
        <sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
          <div style="display: flex; flex-direction: column; gap: 8px; border-top: 1px solid #111111; padding-top: 10px">
            <span style="font-size: 14px; font-weight: 600">{{g.title}}</span>
            <div style="display: flex; flex-wrap: wrap; gap: 6px">
              <sc-for list="{{g.opts}}" as="o" hint-placeholder-count="4">
                <button onClick="{{o.pick}}" aria-pressed="{{o.sel}}" style="min-height: 44px; padding: 0 14px; border-radius: 4px; border: 1px solid {{o.border}}; background: {{o.bg}}; color: {{o.fg}}; font-family: inherit; font-size: 15px; font-weight: 500">{{o.label}}</button>
              </sc-for>
            </div>
          </div>
        </sc-for>
      </div>
    </sc-if>
  </main>

  <footer style="padding: 12px 20px 32px">
    <sc-if value="{{notLast}}" hint-placeholder-val="{{ true }}">
      <button onClick="{{next}}" style="width: 100%; min-height: 54px; border-radius: 4px; border: 0; background: #111111; color: #FFFFFF; font-family: inherit; font-size: 16px; font-weight: 600">다음</button>
    </sc-if>
    <sc-if value="{{last}}" hint-placeholder-val="{{ false }}">
      <a href="HomeDreamer.dc.html" style="min-height: 54px; border-radius: 4px; background: #111111; color: #FFFFFF; font-size: 16px; font-weight: 600; text-decoration: none; display: flex; align-items: center; justify-content: center">내 드림 보트 보기</a>
    </sc-if>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      step: 0,
      answers: {
        '0': ['바다낚시', '가족 나들이·크루징'],
        '1': ['FRP 하우스'],
        '2-0': ['20 ~ 24 ft'],
        '2-1': ['50 ~ 150 마력'],
        '2-2': ['계류장에 둘래요']
      }
    };
  }
  renderVals() {
    const qs = [
      { q: '배로 무엇을 하고 싶으세요?', hint: '중복 선택 가능', multi: true, opts: ['바다낚시', '가족 나들이·크루징', '수상스키·웨이크보드', '섬 여행·캠핑'] },
      { q: '어떤 형태의 배가 끌리세요?', hint: '낚시 스타일에 맞춰 하나만 골라 주세요', multi: false, opts: ['FRP 하우스', 'FRP 센터콘솔', 'FRP 워크어라운드', '콤비보트', '고무보트', '알루미늄보트', '아직 모르겠어요'] },
      { q: '어느 정도 사양을 생각하세요?', hint: '대략이면 충분해요', groups: [
        { title: '크기', opts: ['15 ft 미만', '15 ~ 19 ft', '20 ~ 24 ft', '25 ~ 29 ft', '30 ft 이상'] },
        { title: '엔진', opts: ['5마력 미만 · 면허 불필요', '5 ~ 50 마력', '50 ~ 150 마력', '150 마력 초과'] },
        { title: '보관·이동', opts: ['트레일러로 끌고 다닐래요', '계류장에 둘래요', '아직 모르겠어요'] }
      ] },
      { q: '예산은 어느 정도 생각하세요?', hint: '신품·중고 모두 포함이에요', multi: false, opts: ['3천만 원 미만', '3천만 ~ 1억 원', '1억 ~ 3억 원', '3억 원 이상', '아직 모르겠어요'] },
      { q: '언제쯤 갖고 싶으세요?', hint: '대략이면 충분해요', multi: false, opts: ['1년 안에', '1 ~ 3년 안에', '3년 이후', '아직 꿈만 꿔요'] },
      { q: '조종면허가 있으세요?', hint: '동력수상레저기구 조종면허 기준이에요', multi: false, opts: ['있어요', '준비 중이에요', '아직 없어요'] }
    ];
    const step = this.state.step;
    const cur = qs[step];
    const answers = this.state.answers;
    const setAnswer = (key, label, multi) => {
      const picked = answers[key] || [];
      const next = multi
        ? (picked.includes(label) ? picked.filter((x) => x !== label) : picked.concat([label]))
        : [label];
      this.setState({ answers: Object.assign({}, answers, { [key]: next }) });
    };
    const listOpts = (cur.opts || []).map((label) => {
      const on = (answers[String(step)] || []).includes(label);
      return {
        label,
        sel: on ? 'true' : 'false',
        box: on ? '#111111' : '#FFFFFF',
        weight: on ? 600 : 400,
        pick: () => setAnswer(String(step), label, cur.multi)
      };
    });
    const groups = (cur.groups || []).map((g, gi) => ({
      title: g.title,
      opts: g.opts.map((label) => {
        const key = step + '-' + gi;
        const on = (answers[key] || []).includes(label);
        return {
          label,
          sel: on ? 'true' : 'false',
          bg: on ? '#111111' : '#FFFFFF',
          fg: on ? '#FFFFFF' : '#111111',
          border: on ? '#111111' : '#CFCFCF',
          pick: () => setAnswer(key, label, false)
        };
      })
    }));
    return {
      num: step + 1,
      bars: qs.map((_, i) => ({ color: i <= step ? '#111111' : '#E8E8E8' })),
      question: cur.q,
      hint: cur.hint,
      isList: !cur.groups,
      isGroups: !!cur.groups,
      options: listOpts,
      groups,
      last: step === qs.length - 1,
      notLast: step < qs.length - 1,
      next: () => this.setState({ step: Math.min(step + 1, qs.length - 1) }),
      back: () => this.setState({ step: Math.max(step - 1, 0) })
    };
  }
}
</script>
</body>
</html>
