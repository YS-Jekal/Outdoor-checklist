<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>내 배 등록</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,500;9..40,600;9..40,700&amp;display=swap">
<style>
@font-face{font-family:'Pretendard';src:url('fonts/Pretendard.woff2') format('woff2');font-weight:45 920;font-display:swap}
body{margin:0;font-family:'Pretendard',system-ui,sans-serif;color:#111111;-webkit-font-smoothing:antialiased}
a{color:#111111}a:hover{color:#5E5E5E}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFFFF; display: flex; flex-direction: column">
  <header style="padding: 24px 8px 0 8px; display: flex; align-items: center; justify-content: space-between">
    <button onClick="{{back}}" aria-label="이전 단계" style="width: 44px; height: 44px; border: 0; background: none; display: flex; align-items: center; justify-content: center; color: #111111">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
    </button>
    <a href="Onboarding.dc.html" style="min-height: 44px; padding: 0 12px; display: flex; align-items: center; font-size: 14px; color: #5E5E5E; text-decoration: none">나중에 할게요</a>
  </header>
  <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; padding: 4px 20px 0">
    <sc-for list="{{bars}}" as="b" hint-placeholder-count="4">
      <span style="height: 2px; background: {{b.color}}"></span>
    </sc-for>
  </div>

  <main style="flex: 1; padding: 24px 20px 0; display: flex; flex-direction: column; overflow: hidden">
    <span style="font-family: 'DM Sans', sans-serif; font-size: 12px; font-weight: 600; letter-spacing: 1.4px; color: #5E5E5E">MY BOAT — 0{{num}} / 04</span>
    <h1 style="margin: 10px 0 18px; font-size: 26px; line-height: 1.3; font-weight: 600; letter-spacing: -0.7px">{{title}}</h1>

    <sc-if value="{{s1}}" hint-placeholder-val="{{ true }}">
      <div style="display: flex; flex-direction: column; gap: 14px">
        <label style="display: flex; flex-direction: column; gap: 2px; font-size: 13px; color: #5E5E5E">배 이름
          <input value="바다향" style="min-height: 44px; border: 0; border-bottom: 1.5px solid #111111; outline: none; padding: 0; font-family: inherit; font-size: 18px; font-weight: 500; color: #111111; background: transparent">
        </label>
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px">
          <label style="display: flex; flex-direction: column; gap: 2px; font-size: 13px; color: #5E5E5E">브랜드
            <input value="[브랜드]" style="min-height: 44px; border: 0; border-bottom: 1.5px solid #111111; outline: none; padding: 0; font-family: inherit; font-size: 17px; color: #111111; background: transparent">
          </label>
          <label style="display: flex; flex-direction: column; gap: 2px; font-size: 13px; color: #5E5E5E">세부 모델명
            <input value="[모델명]" style="min-height: 44px; border: 0; border-bottom: 1.5px solid #111111; outline: none; padding: 0; font-family: inherit; font-size: 17px; color: #111111; background: transparent">
          </label>
        </div>
        <span style="font-size: 12px; color: #5E5E5E; margin-top: -6px">모델을 고르면 길이·엔진 기본값을 채워 드려요</span>
        <div style="display: flex; flex-direction: column; gap: 8px">
          <span style="font-size: 13px; color: #5E5E5E">선체 형태</span>
          <div style="display: flex; flex-wrap: wrap; gap: 6px">
            <sc-for list="{{hulls}}" as="o" hint-placeholder-count="6">
              <button onClick="{{o.pick}}" aria-pressed="{{o.sel}}" style="min-height: 40px; padding: 0 12px; border-radius: 4px; border: 1px solid {{o.border}}; background: {{o.bg}}; color: {{o.fg}}; font-family: inherit; font-size: 14px; font-weight: 500">{{o.label}}</button>
            </sc-for>
          </div>
        </div>
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px">
          <label style="display: flex; flex-direction: column; gap: 2px; font-size: 13px; color: #5E5E5E">길이
            <span style="display: flex; align-items: baseline; gap: 4px; border-bottom: 1.5px solid #111111"><input value="26" inputmode="decimal" style="width: 100%; min-height: 44px; border: 0; outline: none; padding: 0; font-family: 'DM Sans', sans-serif; font-size: 22px; font-weight: 600; color: #111111; background: transparent"><span style="font-family: 'DM Sans', sans-serif; font-size: 14px; color: #111111">ft</span></span>
          </label>
          <label style="display: flex; flex-direction: column; gap: 2px; font-size: 13px; color: #5E5E5E">연식
            <span style="display: flex; align-items: baseline; gap: 4px; border-bottom: 1.5px solid #111111"><input value="2016" inputmode="numeric" style="width: 100%; min-height: 44px; border: 0; outline: none; padding: 0; font-family: 'DM Sans', sans-serif; font-size: 22px; font-weight: 600; color: #111111; background: transparent"><span style="font-size: 14px; color: #111111">년</span></span>
          </label>
        </div>
      </div>
    </sc-if>

    <sc-if value="{{s2}}" hint-placeholder-val="{{ false }}">
      <div style="display: flex; flex-direction: column; gap: 16px">
        <div style="display: flex; flex-direction: column; gap: 8px">
          <span style="font-size: 13px; color: #5E5E5E">엔진 종류</span>
          <div style="display: flex; flex-wrap: wrap; gap: 6px">
            <sc-for list="{{kinds}}" as="o" hint-placeholder-count="3">
              <button onClick="{{o.pick}}" aria-pressed="{{o.sel}}" style="min-height: 44px; padding: 0 14px; border-radius: 4px; border: 1px solid {{o.border}}; background: {{o.bg}}; color: {{o.fg}}; font-family: inherit; font-size: 15px; font-weight: 500">{{o.label}}</button>
            </sc-for>
          </div>
        </div>
        <div style="display: flex; flex-direction: column; gap: 8px">
          <span style="font-size: 13px; color: #5E5E5E">행정</span>
          <div style="display: flex; flex-wrap: wrap; gap: 6px">
            <sc-for list="{{strokes}}" as="o" hint-placeholder-count="2">
              <button onClick="{{o.pick}}" aria-pressed="{{o.sel}}" style="min-height: 44px; padding: 0 14px; border-radius: 4px; border: 1px solid {{o.border}}; background: {{o.bg}}; color: {{o.fg}}; font-family: inherit; font-size: 15px; font-weight: 500">{{o.label}}</button>
            </sc-for>
          </div>
        </div>
        <label style="display: flex; flex-direction: column; gap: 2px; font-size: 13px; color: #5E5E5E">엔진 브랜드 · 모델
          <input value="[엔진 브랜드] [모델]" style="min-height: 44px; border: 0; border-bottom: 1.5px solid #111111; outline: none; padding: 0; font-family: inherit; font-size: 17px; color: #111111; background: transparent">
        </label>
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; align-items: end">
          <label style="display: flex; flex-direction: column; gap: 2px; font-size: 13px; color: #5E5E5E">마력 (1기당)
            <span style="display: flex; align-items: baseline; gap: 4px; border-bottom: 1.5px solid #111111"><input value="250" inputmode="numeric" style="width: 100%; min-height: 44px; border: 0; outline: none; padding: 0; font-family: 'DM Sans', sans-serif; font-size: 22px; font-weight: 600; color: #111111; background: transparent"><span style="font-size: 14px; color: #111111">마력</span></span>
          </label>
          <div style="display: flex; flex-direction: column; gap: 6px">
            <span style="font-size: 13px; color: #5E5E5E">엔진 수</span>
            <div style="display: flex; gap: 6px">
              <sc-for list="{{counts}}" as="o" hint-placeholder-count="3">
                <button onClick="{{o.pick}}" aria-pressed="{{o.sel}}" style="min-width: 44px; min-height: 44px; border-radius: 4px; border: 1px solid {{o.border}}; background: {{o.bg}}; color: {{o.fg}}; font-family: 'DM Sans', sans-serif; font-size: 15px; font-weight: 600">{{o.label}}</button>
              </sc-for>
            </div>
          </div>
        </div>
        <label style="display: flex; flex-direction: column; gap: 2px; font-size: 13px; color: #5E5E5E">연료탱크 용량
          <span style="display: flex; align-items: baseline; gap: 4px; border-bottom: 1.5px solid #111111"><input value="150" inputmode="numeric" style="width: 100%; min-height: 44px; border: 0; outline: none; padding: 0; font-family: 'DM Sans', sans-serif; font-size: 22px; font-weight: 600; color: #111111; background: transparent"><span style="font-family: 'DM Sans', sans-serif; font-size: 14px; color: #111111">L</span></span>
        </label>
        <span style="font-size: 12px; color: #5E5E5E; margin-top: -8px">출항 계획 때 연료가 충분한지 계산하는 데 써요</span>
      </div>
    </sc-if>

    <sc-if value="{{s3}}" hint-placeholder-val="{{ false }}">
      <div style="display: flex; flex-direction: column; gap: 12px; margin-top: -8px">
        <span style="font-size: 13px; color: #5E5E5E">있는 것만 골라 주세요. 브랜드·모델은 나중에 내 배 화면에서 채워도 돼요.</span>
        <sc-for list="{{equipGroups}}" as="g" hint-placeholder-count="4">
          <div style="display: flex; flex-direction: column; gap: 6px; border-top: 1px solid #111111; padding-top: 8px">
            <span style="font-size: 13px; font-weight: 600">{{g.title}}</span>
            <div style="display: flex; flex-wrap: wrap; gap: 5px">
              <sc-for list="{{g.items}}" as="o" hint-placeholder-count="5">
                <button onClick="{{o.pick}}" aria-pressed="{{o.sel}}" style="min-height: 38px; padding: 0 10px; border-radius: 4px; border: 1px solid {{o.border}}; background: {{o.bg}}; color: {{o.fg}}; font-family: inherit; font-size: 14px; font-weight: 500">{{o.label}}</button>
              </sc-for>
            </div>
          </div>
        </sc-for>
        <button style="align-self: flex-start; min-height: 38px; padding: 0 10px; border-radius: 4px; border: 1px dashed #9A9A9A; background: #FFFFFF; font-family: inherit; font-size: 14px; color: #111111">+ 직접 추가</button>
      </div>
    </sc-if>

    <sc-if value="{{s4}}" hint-placeholder-val="{{ false }}">
      <div style="display: flex; flex-direction: column; gap: 16px">
        <div style="border-top: 1px solid #111111">
          <sc-for list="{{storages}}" as="o" hint-placeholder-count="3">
            <button onClick="{{o.pick}}" aria-pressed="{{o.sel}}" style="width: 100%; min-height: 64px; padding: 0; border: 0; border-bottom: 1px solid #E8E8E8; background: none; color: #111111; font-family: inherit; display: flex; align-items: center; justify-content: space-between; text-align: left">
              <span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 17px; font-weight: {{o.weight}}">{{o.label}}</span><span style="font-size: 13px; color: #5E5E5E">{{o.sub}}</span></span>
              <span style="width: 22px; height: 22px; border: 1.5px solid #111111; background: {{o.box}}; display: flex; align-items: center; justify-content: center; box-sizing: border-box">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg>
              </span>
            </button>
          </sc-for>
        </div>
        <label style="display: flex; flex-direction: column; gap: 2px; font-size: 13px; color: #5E5E5E">{{portLabel}}
          <input value="전곡항" style="min-height: 44px; border: 0; border-bottom: 1.5px solid #111111; outline: none; padding: 0; font-family: inherit; font-size: 18px; font-weight: 500; color: #111111; background: transparent">
        </label>
        <span style="font-size: 12px; color: #5E5E5E">이곳이 홈의 물때·날씨 기본 지역이 돼요. 다른 지역은 홈에서 바로 바꿀 수 있어요.</span>
      </div>
    </sc-if>
  </main>

  <footer style="padding: 12px 20px 32px">
    <sc-if value="{{notLast}}" hint-placeholder-val="{{ true }}">
      <button onClick="{{next}}" style="width: 100%; min-height: 54px; border-radius: 4px; border: 0; background: #111111; color: #FFFFFF; font-family: inherit; font-size: 16px; font-weight: 600">다음</button>
    </sc-if>
    <sc-if value="{{s4}}" hint-placeholder-val="{{ false }}">
      <a href="Onboarding.dc.html" style="min-height: 54px; border-radius: 4px; background: #111111; color: #FFFFFF; font-size: 16px; font-weight: 600; text-decoration: none; display: flex; align-items: center; justify-content: center">등록하고 사진 정리하기</a>
    </sc-if>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      step: 0, hull: 'FRP 하우스', kind: '선외기', stroke: '4행정', count: '1', storage: '계류장',
      equip: ['어군탐지기', 'GPS 플로터', 'VHF 무전기', '전동 변기', '자동 빌지펌프', '서치라이트']
    };
  }
  equipGroups() {
    const groups = [
      { title: '항해 · 전자', items: ['어군탐지기', 'GPS 플로터', '레이더', 'VHF 무전기', 'AIS', '오토파일럿', '바다내비 단말기'] },
      { title: '낚시', items: ['가이드모터', '전동 앵커', '어창', '전동릴 단자'] },
      { title: '편의', items: ['전동 변기', '청수·샤워', '파워뱅크', '인버터', '태양광 패널'] },
      { title: '안전', items: ['자동 빌지펌프', 'EPIRB', '서치라이트'] }
    ];
    const have = this.state.equip;
    return groups.map((g) => ({
      title: g.title,
      items: g.items.map((label) => {
        const on = have.includes(label);
        return {
          label,
          sel: on ? 'true' : 'false',
          bg: on ? '#111111' : '#FFFFFF',
          fg: on ? '#FFFFFF' : '#111111',
          border: on ? '#111111' : '#CFCFCF',
          pick: () => this.setState({ equip: on ? have.filter((x) => x !== label) : have.concat([label]) })
        };
      })
    }));
  }
  chips(labels, key) {
    return labels.map((label) => {
      const on = this.state[key] === label;
      return {
        label,
        sel: on ? 'true' : 'false',
        bg: on ? '#111111' : '#FFFFFF',
        fg: on ? '#FFFFFF' : '#111111',
        border: on ? '#111111' : '#CFCFCF',
        pick: () => this.setState({ [key]: label })
      };
    });
  }
  renderVals() {
    const step = this.state.step;
    const titles = ['어떤 배인가요?', '엔진을 알려 주세요', '어떤 장비가 있나요?', '배는 어디에 두세요?'];
    const storages = [
      { label: '계류장', sub: '항구에 띄워 두고 써요', port: '계류 항구' },
      { label: '트레일러', sub: '끌고 다니며 여러 곳에서 내려요', port: '주로 내리는 곳' },
      { label: '육상 보관', sub: '보관소에 두고 필요할 때 내려요', port: '보관소 근처 항구' }
    ];
    const cur = storages.find((s) => s.label === this.state.storage) || storages[0];
    return {
      num: step + 1,
      title: titles[step],
      bars: titles.map((_, i) => ({ color: i <= step ? '#111111' : '#E8E8E8' })),
      s1: step === 0,
      s2: step === 1,
      s3: step === 2,
      s4: step === 3,
      notLast: step < 3,
      next: () => this.setState({ step: Math.min(step + 1, 3) }),
      equipGroups: this.equipGroups(),
      back: () => this.setState({ step: Math.max(step - 1, 0) }),
      hulls: this.chips(['FRP 하우스', 'FRP 센터콘솔', 'FRP 워크어라운드', '콤비보트', '고무보트', '알루미늄보트'], 'hull'),
      kinds: this.chips(['선외기', '선내기', '선내외기'], 'kind'),
      strokes: this.chips(['2행정', '4행정'], 'stroke'),
      counts: this.chips(['1', '2', '3'], 'count'),
      portLabel: cur.port,
      storages: storages.map((s) => {
        const on = s.label === this.state.storage;
        return {
          label: s.label,
          sub: s.sub,
          sel: on ? 'true' : 'false',
          weight: on ? 600 : 400,
          box: on ? '#111111' : '#FFFFFF',
          pick: () => this.setState({ storage: s.label })
        };
      })
    };
  }
}
</script>
</body>
</html>
